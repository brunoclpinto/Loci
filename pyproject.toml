[project]
name = "loci"
version = "0.1.0"
description = "A strictly-organized, mixed-source knowledge base that supplies structured knowledge to LLMs over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic>=1.13",
    "qdrant-client>=1.9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "tenacity>=8.2",
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
loci = "loci.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
