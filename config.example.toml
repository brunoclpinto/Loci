# Loci configuration — copy to ~/.loci/config.toml and adjust as needed.
#
# Precedence (highest wins): CLI flag → env var (LOCI_SECTION__KEY) → this file → built-in default
# Example env override: LOCI_OLLAMA__CHAT_MODEL=qwen2.5:7b-instruct
#
# Secrets (DB password, etc.) belong in a .env file next to docker-compose.yml,
# never in this file.

[database]
host   = "localhost"
port   = 5432
user   = "loci"
dbname = "loci"
# password comes from LOCI_DATABASE__PASSWORD env var / .env, not this file

[qdrant]
host        = "localhost"
port        = 6333
prefer_grpc = false

[ollama]
host             = "localhost"
port             = 11434
chat_model       = "qwen2.5:7b-instruct"   # used for entity/relationship extraction
embedding_model  = "nomic-embed-text"      # used for chunk + resolver embeddings
request_timeout_s = 900   # generous — heavy/CPU-offloaded bench models (e.g. deepseek-r1:32b) can be slow

[mcp]
host      = "0.0.0.0"
port      = 8000
transport = "streamable-http"

[registry]
schemas_dir = "loci/schema_registry/seed_schemas"

[resolver]
name_similarity_threshold      = 0.85   # trigram similarity for canonical_name matching
embedding_similarity_threshold = 0.90   # cosine similarity for semantic entity matching

[ingest]
chunk_tokens              = 512
chunk_overlap_tokens      = 64
extraction_window_tokens  = 2500   # larger window given to the LLM for entity/relationship extraction
embed_batch               = 16
extraction_json_retries   = 5

[logging]
level = "INFO"
jsonl = true

[bench]
corpus_dir                = "benchWork/raw"    # raw books, gitignored R&D-only material
qna_dir                   = "benchWork/bench"  # ground-truth QnA sets
qna_file                  = "qna_scarlet.json" # default QnA set for a bench run
log_dir                   = "benchWork/logs"   # per-run JSONL logs + summary.json
default_extraction_model  = "deepseek-r1:32b"  # overridable per run with --extraction-model
default_answer_model      = "phi4-mini"        # overridable per run with --answer-model
sample_interval_s         = 5.0                # docker stats / nvidia-smi polling interval

[bench.weights]
# Composite-score weights — must not need to sum to 1, report.py normalizes.
answer_quality  = 0.6
ingest_time     = 0.1
retrieval_time  = 0.1
knowledge_space = 0.05
ram             = 0.075
vram            = 0.075
