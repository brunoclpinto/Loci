# Loci configuration — copy to ~/.loci/config.toml and adjust as needed.
#
# Precedence (highest wins): CLI flag → env var (LOCI_SECTION__KEY) → this file → built-in default
# Example env override: LOCI_OLLAMA__CHAT_MODEL=qwen2.5:7b-instruct
#
# Secrets (DB password, etc.) belong in a .env file next to docker-compose.yml,
# never in this file.

[database]
host   = "localhost"
port   = 5432
user   = "loci"
dbname = "loci"
# password comes from LOCI_DATABASE__PASSWORD env var / .env, not this file

[qdrant]
host        = "localhost"
port        = 6333
prefer_grpc = false

[ollama]
host             = "localhost"
port             = 11434
chat_model       = "qwen2.5:7b-instruct"   # used for entity/relationship extraction
embedding_model  = "nomic-embed-text"      # used for chunk + resolver embeddings
request_timeout_s = 120

[mcp]
host      = "0.0.0.0"
port      = 8000
transport = "streamable-http"

[registry]
schemas_dir = "loci/schema_registry/seed_schemas"

[resolver]
name_similarity_threshold      = 0.85   # trigram similarity for canonical_name matching
embedding_similarity_threshold = 0.90   # cosine similarity for semantic entity matching

[ingest]
chunk_tokens              = 512
chunk_overlap_tokens      = 64
extraction_window_tokens  = 2500   # larger window given to the LLM for entity/relationship extraction
embed_batch               = 16
extraction_json_retries   = 5

[logging]
level = "INFO"
jsonl = true
